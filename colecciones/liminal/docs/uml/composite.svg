<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Composite — Grupos de luces</title><desc id="descripcion">LuzIndividual y GrupoLuces implementan Encendible. GrupoLuces conserva una lista de Encendible, sin reclamar propiedad compuesta.</desc>
<defs><marker id="triangle" viewBox="0 0 24 24" markerWidth="13" markerHeight="13" refX="22" refY="12" orient="auto"><path d="M2 2 L22 12 L2 22 Z" fill="white" stroke="#25374a" stroke-width="2"/></marker>
<marker id="open" viewBox="0 0 24 24" markerWidth="10" markerHeight="10" refX="22" refY="12" orient="auto"><path d="M7 3 L22 12 L7 21" fill="none" stroke="#25374a" stroke-width="2"/></marker></defs>
<style>.box{fill:#f1f5ff;stroke:#4272a5;stroke-width:2.4}.iface{fill:#f4ecff;stroke:#825cac;stroke-width:2.4}.sep{stroke:#8194ad;stroke-width:1.4}.title{fill:#18283d;font:700 21px Arial,sans-serif;text-anchor:middle}.body{fill:#23364a;font:17px Arial,sans-serif}.edge{fill:none;stroke:#25374a;stroke-width:2.4}.dashed{stroke-dasharray:8 6}.note{fill:#475569;font:italic 17px Arial,sans-serif;text-anchor:middle}</style>
<path class="edge dashed" d="M346 152.5 L490 152.5" marker-end="url(#open)"/>
<path class="edge dashed" d="M440 358 L684.5 230" marker-end="url(#triangle)"/>
<path class="edge dashed" d="M1052.5 345 L684.5 230" marker-end="url(#triangle)"/>
<path class="edge" d="M830 420 L615 417" marker-end="url(#open)"/>
<rect x="40" y="95" width="306" height="115" rx="3" class="box"/><text x="193" y="130" class="title">ClienteComposite</text><path d="M40 148 H346" class="sep"/><text x="54" y="179" class="body">+ ejecutar(out): void</text>
<rect x="490" y="75" width="389" height="155" rx="3" class="iface"/><text x="684.5" y="110" class="title">«interface» Encendible</text><path d="M490 128 H879" class="sep"/><text x="504" y="159" class="body">+ encender(): void</text><text x="504" y="185" class="body">+ apagar(): void</text>
<rect x="265" y="358" width="350" height="118" rx="3" class="box"/><text x="440" y="393" class="title">LuzIndividual</text><path d="M265 411 H615" class="sep"/><text x="279" y="442" class="body">+ encender(): void</text>
<rect x="830" y="345" width="445" height="150" rx="3" class="box"/><text x="1052.5" y="380" class="title">GrupoLuces</text><path d="M830 398 H1275" class="sep"/><text x="844" y="429" class="body">- hijos: List&lt;Encendible&gt;</text><text x="844" y="455" class="body">+ agregar(objeto): void</text>
<text class="note" x="700" y="626">La lista de hijos es asociación: agregar un objeto no prueba composición UML.</text></svg>