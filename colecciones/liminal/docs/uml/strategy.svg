<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Strategy: un monstruo conserva una estrategia intercambiable</title><desc id="descripcion">MonstruoOscuro conserva una referencia a EstrategiaMovimiento; Patrullar, Perseguir y Esperar realizan ese contrato; el mapa limita destinos válidos.</desc>
<style>
.caja{fill:#f2f6ff;stroke:#4373a5;stroke-width:2}
.interfaz{fill:#f3ecff;stroke:#8152b6;stroke-width:2}
.linea{stroke:#26374c;stroke-width:2.5;fill:none}
.dash{stroke-dasharray:9 6}
.nombre{font:700 20px Arial,sans-serif;fill:#152238;text-anchor:middle}
.metodo{font:17px Arial,sans-serif;fill:#23364a}
.nota{font:italic 16px Arial,sans-serif;fill:#415774;text-anchor:middle}
.triangulo{fill:white;stroke:#26374c;stroke-width:2.5}
</style><rect class="caja" x="22" y="42" width="272" height="128" rx="3"/><text class="nombre" x="158" y="73">ClienteStrategy</text><line x1="22" y1="88" x2="294" y2="88" stroke="#8b9aaa"/><text class="metodo" x="35" y="116">+ ejecutar(out): void</text><rect class="caja" x="335" y="32" width="310" height="172" rx="3"/><text class="nombre" x="490" y="63">MonstruoOscuro</text><line x1="335" y1="78" x2="645" y2="78" stroke="#8b9aaa"/><text class="metodo" x="348" y="106">- mapa: MapaLiminal</text><text class="metodo" x="348" y="130">- estrategia: EstrategiaMovimiento</text><text class="metodo" x="348" y="154">~ cambiarEstrategia(nueva)</text><rect class="interfaz" x="757" y="32" width="450" height="172" rx="3"/><text class="nombre" x="982" y="63">«interface» EstrategiaMovimiento</text><line x1="757" y1="78" x2="1207" y2="78" stroke="#8b9aaa"/><text class="metodo" x="770" y="106">+ elegirDestino(mapa, origen, objetivo)</text><rect class="caja" x="22" y="283" width="270" height="130" rx="3"/><text class="nombre" x="157" y="314">MapaLiminal</text><line x1="22" y1="329" x2="292" y2="329" stroke="#8b9aaa"/><text class="metodo" x="35" y="357">~ agregarSalida(...)</text><text class="metodo" x="35" y="381">~ conecta(origen, destino)</text><rect class="caja" x="354" y="332" width="240" height="114" rx="3"/><text class="nombre" x="474" y="363">Patrullar</text><line x1="354" y1="378" x2="594" y2="378" stroke="#8b9aaa"/><text class="metodo" x="367" y="406">+ elegirDestino(...)</text><rect class="caja" x="643" y="332" width="240" height="114" rx="3"/><text class="nombre" x="763" y="363">Perseguir</text><line x1="643" y1="378" x2="883" y2="378" stroke="#8b9aaa"/><text class="metodo" x="656" y="406">+ elegirDestino(...)</text><rect class="caja" x="932" y="332" width="240" height="114" rx="3"/><text class="nombre" x="1052" y="363">Esperar</text><line x1="932" y1="378" x2="1172" y2="378" stroke="#8b9aaa"/><text class="metodo" x="945" y="406">+ elegirDestino(...)</text><path class="linea dash" d="M294 112 H335"/><path class="linea" d="M322 102 L335 112 L322 122"/>
