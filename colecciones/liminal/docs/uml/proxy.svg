<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Proxy — Cámara de pasillo</title><desc id="descripcion">ProxyCamara y CamaraReal realizan Camara; el proxy comprueba un pase y crea la cámara real cuando está autorizado.</desc>
<defs><marker id="triangle" viewBox="0 0 24 24" markerWidth="13" markerHeight="13" refX="22" refY="12" orient="auto"><path d="M2 2 L22 12 L2 22 Z" fill="white" stroke="#25374a" stroke-width="2"/></marker>
<marker id="open" viewBox="0 0 24 24" markerWidth="10" markerHeight="10" refX="22" refY="12" orient="auto"><path d="M7 3 L22 12 L7 21" fill="none" stroke="#25374a" stroke-width="2"/></marker></defs>
<style>.box{fill:#f1f5ff;stroke:#4272a5;stroke-width:2.4}.iface{fill:#f4ecff;stroke:#825cac;stroke-width:2.4}.sep{stroke:#8194ad;stroke-width:1.4}.title{fill:#18283d;font:700 21px Arial,sans-serif;text-anchor:middle}.body{fill:#23364a;font:17px Arial,sans-serif}.edge{fill:none;stroke:#25374a;stroke-width:2.4}.dashed{stroke-dasharray:8 6}.note{fill:#475569;font:italic 17px Arial,sans-serif;text-anchor:middle}</style>
<path class="edge dashed" d="M342 157 L510 160" marker-end="url(#open)"/>
<path class="edge dashed" d="M588.5 363 L725 240" marker-end="url(#triangle)"/>
<path class="edge dashed" d="M1147.5 365 L725 240" marker-end="url(#triangle)"/>
<path class="edge" d="M802 445.5 L947 435.5" marker-end="url(#open)"/>
<rect x="32" y="92" width="310" height="130" rx="3" class="box"/><text x="187" y="127" class="title">ClienteProxy</text><path d="M32 145 H342" class="sep"/><text x="46" y="176" class="body">+ ejecutar(out): void</text>
<rect x="510" y="80" width="430" height="160" rx="3" class="iface"/><text x="725" y="115" class="title">«interface» Camara</text><path d="M510 133 H940" class="sep"/><text x="524" y="164" class="body">+ observar(pase): String</text>
<rect x="375" y="363" width="427" height="165" rx="3" class="box"/><text x="588.5" y="398" class="title">ProxyCamara</text><path d="M375 416 H802" class="sep"/><text x="389" y="447" class="body">- real: CamaraReal</text><text x="389" y="473" class="body">+ observar(pase): String</text>
<rect x="947" y="365" width="401" height="141" rx="3" class="box"/><text x="1147.5" y="400" class="title">CamaraReal</text><path d="M947 418 H1348" class="sep"/><text x="961" y="449" class="body">+ observar(pase): String</text>
<text class="note" x="700" y="626">La cámara real se construye a demanda, y el cliente utiliza el mismo contrato.</text></svg>