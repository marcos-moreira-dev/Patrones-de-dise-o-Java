<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Chain of Responsibility — Comprobar un cruce</title><desc id="descripcion">ValidadorCruce encadena VerificarDestino, VerificarSalida y VerificarPuerta. El primer rechazo detiene el recorrido.</desc><defs>
<marker id="tri" viewBox="0 0 24 24" markerWidth="13" markerHeight="13" refX="22" refY="12" orient="auto"><path d="M2 2 L22 12 L2 22 Z" fill="white" stroke="#25374a" stroke-width="2"/></marker>
<marker id="open" viewBox="0 0 24 24" markerWidth="10" markerHeight="10" refX="22" refY="12" orient="auto"><path d="M7 3 L22 12 L7 21" fill="none" stroke="#25374a" stroke-width="2"/></marker>
</defs><style>.box{fill:#f1f5ff;stroke:#4272a5;stroke-width:2.4}.iface{fill:#f4ecff;stroke:#825cac;stroke-width:2.4}.sep{stroke:#8194ad;stroke-width:1.4}.title{fill:#18283d;font:700 20px Arial,sans-serif;text-anchor:middle}.body{fill:#23364a;font:17px Arial,sans-serif}.edge{fill:none;stroke:#25374a;stroke-width:2.4}.dash{stroke-dasharray:8 6}.note{fill:#475569;font:italic 17px Arial,sans-serif;text-anchor:middle}</style>
<path class="edge dash" d="M363 138 L515 134" marker-end="url(#open)"/>
<path class="edge" d="M247.5 370 L727.5 214" marker-end="url(#tri)"/>
<path class="edge" d="M667.5 370 L727.5 214" marker-end="url(#tri)"/>
<path class="edge" d="M1097.5 370 L727.5 214" marker-end="url(#tri)"/>
<path class="edge dash" d="M940 134 L1025 105" marker-end="url(#open)"/>
<rect x="35" y="73" width="328" height="130" rx="3" class="box"/><text class="title" x="199" y="107">ClienteChainOfResponsibility</text><path class="sep" d="M35 125 H363"/><text class="body" x="49" y="156">+ ejecutar(out)</text>
<rect x="515" y="54" width="425" height="160" rx="3" class="box"/><text class="title" x="727.5" y="88">«abstract» ValidadorCruce</text><path class="sep" d="M515 106 H940"/><text class="body" x="529" y="137">- siguiente: ValidadorCruce</text><text class="body" x="529" y="162">+ verificar(s): String</text>
<rect x="65" y="370" width="365" height="130" rx="3" class="box"/><text class="title" x="247.5" y="404">VerificarDestino</text><path class="sep" d="M65 422 H430"/><text class="body" x="79" y="453">+ detectarRechazo(s)</text>
<rect x="485" y="370" width="365" height="130" rx="3" class="box"/><text class="title" x="667.5" y="404">VerificarSalida</text><path class="sep" d="M485 422 H850"/><text class="body" x="499" y="453">+ detectarRechazo(s)</text>
<rect x="915" y="370" width="365" height="130" rx="3" class="box"/><text class="title" x="1097.5" y="404">VerificarPuerta</text><path class="sep" d="M915 422 H1280"/><text class="body" x="929" y="453">+ detectarRechazo(s)</text>
<rect x="1025" y="45" width="310" height="120" rx="3" class="box"/><text class="title" x="1180" y="79">«record» SolicitudCruce</text><path class="sep" d="M1025 97 H1335"/><text class="body" x="1039" y="128">+ origen / destino</text>
<text class="note" x="700" y="627">El último validador permite el cruce solo si nadie rechaza la solicitud.</text></svg>