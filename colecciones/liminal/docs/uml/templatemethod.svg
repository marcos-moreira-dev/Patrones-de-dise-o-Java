<rect x="495" y="88" width="435" height="220" rx="3" class="box"/><text class="title" x="712.5" y="122">«abstract» RutaExploracion</text><path class="sep" d="M495 140 H930"/><text class="body" x="509" y="171">+ recorrer(): List&lt;String&gt; {final}</text><text class="body" x="509" y="196"># observar(): String</text>
