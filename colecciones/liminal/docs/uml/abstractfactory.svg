<text class="title" x="200" y="762">«record» LuzAmarilla</text>
<path class="sep" d="M30 780 H370"/>
<text class="body" x="48" y="813">+ tema(): AMARILLO</text>
<text class="body" x="48" y="842">+ aspecto(): String</text>
<rect class="box" x="390" y="725" width="340" height="142" rx="4"/>
<text class="title" x="560" y="762">«record» LuzPiscinas</text>
<path class="sep" d="M390 780 H730"/>
<text class="body" x="408" y="813">+ tema(): PISCINAS</text>
<text class="body" x="408" y="842">+ aspecto(): String</text>
<rect class="box" x="750" y="725" width="350" height="142" rx="4"/>
<text class="title" x="925" y="762">«record» PuertaAmarilla</text>
<path class="sep" d="M750 780 H1100"/>
<text class="body" x="768" y="813">+ tema(): AMARILLO</text>
<text class="body" x="768" y="842">+ estado(): CERRADA</text>
<rect class="box" x="1120" y="725" width="360" height="142" rx="4"/>
<text class="title" x="1300" y="762">«record» PuertaPiscinas</text>
<path class="sep" d="M1120 780 H1480"/>
<text class="body" x="1138" y="813">+ tema(): PISCINAS</text>
<text class="body" x="1138" y="842">+ estado(): CERRADA</text>
<text class="note" x="800" y="909">Una familia se define por tipos y contratos compatibles; los temas no modifican las reglas globales del dominio.</text>
</svg>