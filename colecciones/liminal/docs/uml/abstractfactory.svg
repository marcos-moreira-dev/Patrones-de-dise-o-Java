<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Abstract Factory — dos familias de clases concretas</title>
<desc id="descripcion">Escena recibe FabricaAmbiente. FabricaAmarilla y FabricaPiscinas realizan la fábrica abstracta. LuzAmarilla y LuzPiscinas realizan LuzDelNivel; PuertaAmarilla y PuertaPiscinas realizan PuertaDelNivel. Una escena guarda asociaciones con sus productos; las cuatro clases de producto son distintas.</desc>
<defs><marker id="tri" viewBox="0 0 24 24" markerWidth="14" markerHeight="14" refX="22" refY="12" orient="auto"><path d="M2 2 L22 12 L2 22 Z" fill="white" stroke="#30455f" stroke-width="2"/></marker><marker id="v" viewBox="0 0 24 24" markerWidth="12" markerHeight="12" refX="22" refY="12" orient="auto"><path d="M7 4 L22 12 L7 20" fill="none" stroke="#30455f" stroke-width="2"/></marker></defs>
<style>.box{fill:#eef5ff;stroke:#4876a4;stroke-width:2.3}.interface{fill:#f4ebff;stroke:#7b58a8;stroke-width:2.3}.title{font:700 20px Arial,sans-serif;text-anchor:middle;fill:#192b41}.body{font:18px Arial,sans-serif;fill:#273e55}.sep{stroke:#9aabc0;stroke-width:1.5}.edge{stroke:#30455f;fill:none;stroke-width:2.5}.dash{stroke-dasharray:9 6}.note{font:italic 17px Arial,sans-serif;fill:#506078;text-anchor:middle}</style>
<rect width="1600" height="940" fill="#fff"/>
<!-- Relaciones trazadas detrás de las clases -->
<path class="edge dash" d="M360 160 H415" marker-end="url(#v)"/>
<path class="edge dash" d="M795 160 H885" marker-end="url(#v)"/>
<path class="edge" d="M510 272 L280 400" marker-end="url(#v)"/>
<path class="edge" d="M700 272 L700 400" marker-end="url(#v)"/>
<path class="edge dash" d="M1068 350 L1068 258" marker-end="url(#tri)"/>
<path class="edge dash" d="M1435 350 L1215 258" marker-end="url(#tri)"/>
<path class="edge dash" d="M200 725 L270 562" marker-end="url(#tri)"/>
<path class="edge dash" d="M560 725 L392 562" marker-end="url(#tri)"/>
<path class="edge dash" d="M920 725 L690 562" marker-end="url(#tri)"/>
<path class="edge dash" d="M1300 725 L830 562" marker-end="url(#tri)"/>
<rect class="box" x="25" y="85" width="335" height="145" rx="4"/>
<text class="title" x="192.5" y="122">ClienteAbstractFactory</text>
<path class="sep" d="M25 140 H360"/>
<text class="body" x="43" y="173">+ ejecutar(out): void</text>
<rect class="box" x="415" y="70" width="380" height="202" rx="4"/>
<text class="title" x="605" y="107">Escena</text>
<path class="sep" d="M415 125 H795"/>
<text class="body" x="433" y="158">- luz: LuzDelNivel</text>
<text class="body" x="433" y="187">- puerta: PuertaDelNivel</text>
<text class="body" x="433" y="216">+ descripcion(): String</text>
<rect class="interface" x="885" y="65" width="430" height="193" rx="4"/>
<text class="title" x="1100" y="102">«interface» FabricaAmbiente</text>
<path class="sep" d="M885 120 H1315"/>
<text class="body" x="903" y="153">+ crearLuz(): LuzDelNivel</text>
<text class="body" x="903" y="182">+ crearPuerta(): PuertaDelNivel</text>
<rect class="box" x="925" y="350" width="310" height="153" rx="4"/>
<text class="title" x="1080" y="387">FabricaAmarilla</text>
<path class="sep" d="M925 405 H1235"/>
<text class="body" x="943" y="438">+ crearLuz()</text>
<text class="body" x="943" y="467">+ crearPuerta()</text>
<rect class="box" x="1260" y="350" width="310" height="153" rx="4"/>
<text class="title" x="1415" y="387">FabricaPiscinas</text>
<path class="sep" d="M1260 405 H1570"/>
<text class="body" x="1278" y="438">+ crearLuz()</text>
<text class="body" x="1278" y="467">+ crearPuerta()</text>
<rect class="interface" x="80" y="400" width="370" height="162" rx="4"/>
<text class="title" x="265" y="437">«interface» LuzDelNivel</text>
<path class="sep" d="M80 455 H450"/>
<text class="body" x="98" y="488">+ tema(): Tema</text>
<text class="body" x="98" y="517">+ aspecto(): String</text>
<rect class="interface" x="500" y="400" width="370" height="162" rx="4"/>
<text class="title" x="685" y="437">«interface» PuertaDelNivel</text>
<path class="sep" d="M500 455 H870"/>
<text class="body" x="518" y="488">+ tema(): Tema</text>
<text class="body" x="518" y="517">+ aspecto(): String</text>
<text class="body" x="518" y="546">+ estado(): String</text>
