<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Abstract Factory: familias coherentes de dispositivos</title><desc id="descripcion">Las fábricas Amarilla y Piscinas implementan FabricaAmbiente; generan luces y puertas de su mismo tema.</desc><style>
.b{fill:#f1f5ff;stroke:#3c6da1;stroke-width:2}.i{fill:#f4ecff;stroke:#8159a7;stroke-width:2}.l{stroke:#25374a;stroke-width:2.5;fill:none}.d{stroke-dasharray:9 7}.tri{fill:white;stroke:#25374a;stroke-width:2.5}.t{fill:#17283d;font:700 22px Arial,sans-serif;text-anchor:middle}.m{fill:#23364a;font:18px Arial,sans-serif}.n{fill:#475569;font:italic 18px Arial,sans-serif;text-anchor:middle}
</style><rect class="b" x="32" y="45" width="318" height="124" rx="2"/><text class="t" x="191" y="79">ClienteAbstractFactory</text><path class="l" d="M32 97 H350"/><text class="m" x="46" y="127">+ ejecutar(out): void</text><rect class="i" x="468" y="30" width="460" height="160" rx="2"/><text class="t" x="698" y="64">«interface» FabricaAmbiente</text><path class="l" d="M468 82 H928"/><text class="m" x="482" y="112">+ crearLuz(): LuzDelNivel</text><text class="m" x="482" y="138">+ crearPuerta(): PuertaDelNivel</text><rect class="b" x="366" y="325" width="395" height="110" rx="2"/><text class="t" x="563.5" y="359">FabricaAmarilla</text><path class="l" d="M366 377 H761"/><text class="m" x="380" y="407">+ crearLuz / crearPuerta</text><rect class="b" x="798" y="325" width="405" height="110" rx="2"/><text class="t" x="1000.5" y="359">FabricaPiscinas</text><path class="l" d="M798 377 H1203"/><text class="m" x="812" y="407">+ crearLuz / crearPuerta</text><rect class="i" x="1000" y="30" width="372" height="128" rx="2"/><text class="t" x="1186" y="64">«interface» LuzDelNivel</text><path class="l" d="M1000 82 H1372"/><text class="m" x="1014" y="112">+ tema(): Tema</text><rect class="i" x="1000" y="185" width="372" height="128" rx="2"/><text class="t" x="1186" y="219">«interface» PuertaDelNivel</text><path class="l" d="M1000 237 H1372"/><text class="m" x="1014" y="267">+ tema(): Tema</text><path class="l d" d="M350 100 L468 100"/><path class="l d" d="M690 325 L690 213"/><path class="tri" d="M675 210 L690 190 L705 210 Z"/><path class="l d" d="M1000 325 L820 213"/><path class="tri" d="M805 210 L820 190 L835 210 Z"/><path class="l d" d="M928 90 L1000 90"/><path class="l d" d="M928 137 L990 240"/><text class="n" x="700" y="553">Tema AMARILLO o PISCINAS cambia la apariencia, no las reglas de las puertas.</text></svg>