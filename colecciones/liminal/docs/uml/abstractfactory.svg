<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Abstract Factory — fábrica de escenas con familias de productos</title>
<desc id="descripcion">ClienteAbstractFactory utiliza Escena, que depende de FabricaAmbiente. FabricaAmarilla y FabricaPiscinas realizan FabricaAmbiente. LuzAmbiental realiza LuzDelNivel y PuertaAmbiental realiza PuertaDelNivel. Las fábricas crean productos con configuraciones AMARILLO y PISCINAS.</desc>
<defs>
<marker id="tri" viewBox="0 0 24 24" markerWidth="13" markerHeight="13" refX="22" refY="12" orient="auto"><path d="M2 2 L22 12 L2 22 Z" fill="white" stroke="#25374a" stroke-width="2"/></marker>
<marker id="open" viewBox="0 0 24 24" markerWidth="10" markerHeight="10" refX="22" refY="12" orient="auto"><path d="M7 3 L22 12 L7 21" fill="none" stroke="#25374a" stroke-width="2"/></marker></defs>
<style>
.box{fill:#eef5ff;stroke:#4272a5;stroke-width:2.3}.iface{fill:#f5edff;stroke:#845baa;stroke-width:2.3}
.edge{stroke:#26394e;fill:none;stroke-width:2.5}.dashed{stroke-dasharray:9 6}
.sep{stroke:#8ea1b8;stroke-width:1.4}.title{fill:#16273c;font:700 21px Arial,sans-serif;text-anchor:middle}
.body{fill:#23364a;font:17px Arial,sans-serif}.note{fill:#475569;font:italic 17px Arial,sans-serif;text-anchor:middle}
</style>
<!-- Cliente -> Escena -> fábrica abstracta -->
<path class="edge dashed" d="M320 128 H372" marker-end="url(#open)"/>
<path class="edge dashed" d="M670 128 H765" marker-end="url(#open)"/>
<!-- Las fábricas concretas implementan el contrato; marcador triangular hueco. -->
<path class="edge dashed" d="M1207 350 V278 H1050 V235" marker-end="url(#tri)"/>
<path class="edge dashed" d="M1230 560 V305 H1100 V235" marker-end="url(#tri)"/>
<!-- La fábrica abstracta declara los productos abstractos. -->
<path class="edge dashed" d="M835 235 L260 430" marker-end="url(#open)"/>
<path class="edge dashed" d="M925 235 L670 430" marker-end="url(#open)"/>
<!-- Los registros concretos realizan las interfaces de producto. -->
<path class="edge dashed" d="M260 650 V570" marker-end="url(#tri)"/>
<path class="edge dashed" d="M670 650 V570" marker-end="url(#tri)"/>
<!-- Asociación estructural: Escena retiene dos productos, no su propiedad compuesta. -->
<path class="edge" d="M521 205 V340 H175 V430" marker-end="url(#open)"/>
<path class="edge" d="M587 205 V360 H615 V430" marker-end="url(#open)"/>
<!-- Clases -->
<rect class="box" x="30" y="70" width="290" height="125" rx="3"/>
<text class="title" x="175" y="106">ClienteAbstractFactory</text><path class="sep" d="M30 124 H320"/>
<text class="body" x="44" y="160">+ ejecutar(out): void</text>
<rect class="box" x="372" y="65" width="298" height="140" rx="3"/>
<text class="title" x="521" y="102">Escena</text><path class="sep" d="M372 120 H670"/>
<text class="body" x="386" y="154">- luz: LuzDelNivel</text>
<text class="body" x="386" y="180">- puerta: PuertaDelNivel</text>
<rect class="iface" x="765" y="55" width="440" height="180" rx="3"/>
<text class="title" x="985" y="92">«interface» FabricaAmbiente</text>
<path class="sep" d="M765 111 H1205"/>
<text class="body" x="779" y="146">+ crearLuz(): LuzDelNivel</text>
<text class="body" x="779" y="172">+ crearPuerta(): PuertaDelNivel</text>
<rect class="iface" x="65" y="430" width="390" height="140" rx="3"/>
<text class="title" x="260" y="467">«interface» LuzDelNivel</text><path class="sep" d="M65 486 H455"/>
<text class="body" x="79" y="521">+ tema(): Tema</text>
<rect class="iface" x="475" y="430" width="390" height="140" rx="3"/>
<text class="title" x="670" y="467">«interface» PuertaDelNivel</text><path class="sep" d="M475 486 H865"/>
<text class="body" x="489" y="521">+ tema(): Tema</text>
<rect class="box" x="65" y="650" width="390" height="140" rx="3"/>
<text class="title" x="260" y="688">«record» LuzAmbiental</text><path class="sep" d="M65 706 H455"/>
<text class="body" x="79" y="742">- tema: Tema</text>
<rect class="box" x="475" y="650" width="390" height="140" rx="3"/>
<text class="title" x="670" y="688">«record» PuertaAmbiental</text><path class="sep" d="M475 706 H865"/>
<text class="body" x="489" y="742">- tema: Tema</text>
<rect class="box" x="1030" y="350" width="420" height="155" rx="3"/>
<text class="title" x="1240" y="387">FabricaAmarilla</text><path class="sep" d="M1030 405 H1450"/>
<text class="body" x="1044" y="438">+ crearLuz(): LuzDelNivel</text>
<text class="body" x="1044" y="465">+ crearPuerta(): PuertaDelNivel</text>
<rect class="box" x="1030" y="560" width="420" height="155" rx="3"/>
<text class="title" x="1240" y="597">FabricaPiscinas</text><path class="sep" d="M1030 615 H1450"/>
<text class="body" x="1044" y="649">+ crearLuz(): LuzDelNivel</text>
<text class="body" x="1044" y="676">+ crearPuerta(): PuertaDelNivel</text>
<text class="note" x="750" y="830">Las familias usan los mismos records con Tema distinto: cambia la configuración, no el contrato.</text>
</svg>