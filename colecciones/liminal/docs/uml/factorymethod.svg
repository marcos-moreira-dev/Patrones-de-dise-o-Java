<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Factory Method: generadores concretos crean criaturas</title><desc id="descripcion">GeneradorOscuro y GeneradorSilencioso heredan de GeneradorCriatura. Los productos implementan Criatura.</desc><style>
.b{fill:#f1f5ff;stroke:#3c6da1;stroke-width:2}.i{fill:#f4ecff;stroke:#8159a7;stroke-width:2}.l{stroke:#25374a;stroke-width:2.5;fill:none}.d{stroke-dasharray:9 7}.tri{fill:white;stroke:#25374a;stroke-width:2.5}.t{fill:#17283d;font:700 22px Arial,sans-serif;text-anchor:middle}.m{fill:#23364a;font:18px Arial,sans-serif}.n{fill:#475569;font:italic 18px Arial,sans-serif;text-anchor:middle}
</style><rect class="b" x="20" y="50" width="302" height="130" rx="2"/><text class="t" x="171" y="84">ClienteFactoryMethod</text><path class="l" d="M20 102 H322"/><text class="m" x="34" y="132">+ ejecutar(out): void</text><rect class="b" x="370" y="60" width="410" height="165" rx="2"/><text class="t" x="575" y="94">«abstract» GeneradorCriatura</text><path class="l" d="M370 112 H780"/><text class="m" x="384" y="142">+ aparecer(...): Criatura</text><text class="m" x="384" y="168"># crearCriatura(...): Criatura</text><rect class="i" x="941" y="46" width="405" height="145" rx="2"/><text class="t" x="1143.5" y="80">«interface» Criatura</text><path class="l" d="M941 98 H1346"/><text class="m" x="955" y="128">+ id(): String</text><text class="m" x="955" y="154">+ habitacion(): String</text><rect class="b" x="150" y="380" width="350" height="120" rx="2"/><text class="t" x="325" y="414">GeneradorOscuro</text><path class="l" d="M150 432 H500"/><text class="m" x="164" y="462">+ crearCriatura(...)</text><rect class="b" x="540" y="380" width="395" height="120" rx="2"/><text class="t" x="737.5" y="414">GeneradorSilencioso</text><path class="l" d="M540 432 H935"/><text class="m" x="554" y="462">+ crearCriatura(...)</text><rect class="b" x="975" y="280" width="400" height="115" rx="2"/><text class="t" x="1175" y="314">MonstruoOscuro</text><path class="l" d="M975 332 H1375"/><text class="m" x="989" y="362">+ nombre(): String</text><rect class="b" x="975" y="433" width="400" height="115" rx="2"/><text class="t" x="1175" y="467">MonstruoSilencioso</text><path class="l" d="M975 485 H1375"/><text class="m" x="989" y="515">+ nombre(): String</text><path class="l d" d="M322 122 L370 122"/><path class="l" d="M560 380 L560 246"/><path class="tri" d="M545 245 L560 225 L575 245 Z"/><path class="l" d="M745 380 L655 246"/><path class="tri" d="M640 245 L655 225 L670 245 Z"/><path class="l d" d="M780 125 L941 125"/><path class="l d" d="M1155 280 L1110 215"/><path class="tri" d="M1095 211 L1110 191 L1125 211 Z"/><path class="l d" d="M1180 433 L1245 215"/><path class="tri" d="M1230 211 L1245 191 L1260 211 Z"/><text class="n" x="700" y="553">El creador común invoca crearCriatura; cada subclase decide el tipo concreto.</text></svg>