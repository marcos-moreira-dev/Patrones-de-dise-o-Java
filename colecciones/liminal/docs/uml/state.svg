<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">State: una puerta delega su comportamiento</title><desc id="descripcion">Puerta mantiene una asociación navegable con EstadoPuerta. EstadoCerrada, EstadoAbierta y EstadoBloqueada realizan la interfaz. ClienteState utiliza Puerta.</desc>
<style>
.caja{fill:#f2f6ff;stroke:#4373a5;stroke-width:2}
.interfaz{fill:#f3ecff;stroke:#8152b6;stroke-width:2}
.linea{stroke:#26374c;stroke-width:2.5;fill:none}
.dash{stroke-dasharray:9 6}
.nombre{font:700 20px Arial,sans-serif;fill:#152238;text-anchor:middle}
.metodo{font:17px Arial,sans-serif;fill:#23364a}
.nota{font:italic 16px Arial,sans-serif;fill:#415774;text-anchor:middle}
.triangulo{fill:white;stroke:#26374c;stroke-width:2.5}
</style><rect class="caja" x="22" y="62" width="260" height="114" rx="3"/><text class="nombre" x="152" y="93">ClienteState</text><line x1="22" y1="108" x2="282" y2="108" stroke="#8b9aaa"/><text class="metodo" x="35" y="136">+ ejecutar(out): void</text><rect class="caja" x="338" y="52" width="298" height="170" rx="3"/><text class="nombre" x="487" y="83">Puerta</text><line x1="338" y1="98" x2="636" y2="98" stroke="#8b9aaa"/><text class="metodo" x="351" y="126">- estado: EstadoPuerta</text><text class="metodo" x="351" y="150">+ abrir(): void</text><text class="metodo" x="351" y="174">+ bloquear(): void</text><text class="metodo" x="351" y="198">+ desbloquear(llave): void</text><rect class="interfaz" x="770" y="52" width="426" height="170" rx="3"/><text class="nombre" x="983" y="83">«interface» EstadoPuerta</text><line x1="770" y1="98" x2="1196" y2="98" stroke="#8b9aaa"/><text class="metodo" x="783" y="126">+ abrir(): EstadoPuerta</text><text class="metodo" x="783" y="150">+ bloquear(): EstadoPuerta</text><text class="metodo" x="783" y="174">+ transitable(): boolean</text><path class="linea dash" d="M282 126 H338"/><path class="linea" d="M327 116 L338 126 L327 136"/>
<path class="linea" d="M636 126 H770"/><path class="linea" d="M757 116 L770 126 L757 136"/>
<rect class="caja" x="55" y="354" width="338" height="113" rx="3"/><text class="nombre" x="224" y="385">EstadoCerrada</text><line x1="55" y1="400" x2="393" y2="400" stroke="#8b9aaa"/><text class="metodo" x="68" y="428">+ abrir() → EstadoAbierta</text><rect class="caja" x="451" y="354" width="338" height="113" rx="3"/><text class="nombre" x="620" y="385">EstadoAbierta</text><line x1="451" y1="400" x2="789" y2="400" stroke="#8b9aaa"/><text class="metodo" x="464" y="428">+ cerrar() → EstadoCerrada</text><rect class="caja" x="848" y="354" width="338" height="113" rx="3"/><text class="nombre" x="1017" y="385">EstadoBloqueada</text><line x1="848" y1="400" x2="1186" y2="400" stroke="#8b9aaa"/><text class="metodo" x="861" y="428">+ desbloquear(llave)</text><path class="linea dash" d="M224 354 L840 242"/>
<path class="linea dash" d="M620 354 L975 242"/>
<path class="linea dash" d="M1018 354 L1110 242"/>
<path class="triangulo" d="M826 242 L840 222 L854 242 Z"/>
<path class="triangulo" d="M961 242 L975 222 L989 242 Z"/>
<path class="triangulo" d="M1096 242 L1110 222 L1124 242 Z"/>
<text class="nota" x="620" y="517">El estado modifica la respuesta; no se infiere composición por usar new.</text></svg>