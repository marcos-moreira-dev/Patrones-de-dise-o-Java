<rect x="45" y="93" width="312" height="130" rx="3" class="box"/><text class="title" x="201" y="127">ClienteIterator</text><path class="sep" d="M45 145 H357"/><text class="body" x="59" y="176">+ ejecutar(out)</text>
<rect x="453" y="75" width="405" height="175" rx="3" class="box"/><text class="title" x="655.5" y="109">RegistroHabitaciones</text><path class="sep" d="M453 127 H858"/><text class="body" x="467" y="158">- habitaciones: List&lt;Habitacion&gt;</text><text class="body" x="467" y="183">+ iterator(): Iterator</text>
<rect x="930" y="66" width="408" height="160" rx="3" class="iface"/><text class="title" x="1134" y="100">«interface» Iterator&lt;Habitacion&gt;</text><path class="sep" d="M930 118 H1338"/><text class="body" x="944" y="149">+ hasNext(): boolean</text><text class="body" x="944" y="174">+ next(): Habitacion</text>
<rect x="845" y="358" width="455" height="155" rx="3" class="box"/><text class="title" x="1072.5" y="392">RecorridoHabitaciones</text><path class="sep" d="M845 410 H1300"/><text class="body" x="859" y="441">- instantanea: List&lt;Habitacion&gt;</text><text class="body" x="859" y="466">+ next(): Habitacion</text>
<rect x="310" y="365" width="395" height="120" rx="3" class="box"/><text class="title" x="507.5" y="399">«record» Habitacion</text><path class="sep" d="M310 417 H705"/><text class="body" x="324" y="448">+ id(): String</text>
<text class="note" x="700" y="627">El iterador recorre una instantánea sin exponer la lista modificable del registro.</text></svg>