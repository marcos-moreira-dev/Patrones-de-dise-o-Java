<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Singleton: único panel de avisos en esta demostración</title><desc id="descripcion">ClienteSingleton utiliza el acceso estático de PanelAvisos; no se crea un segundo objeto panel.</desc><style>
.b{fill:#f1f5ff;stroke:#3c6da1;stroke-width:2}.i{fill:#f4ecff;stroke:#8159a7;stroke-width:2}.l{stroke:#25374a;stroke-width:2.5;fill:none}.d{stroke-dasharray:9 7}.tri{fill:white;stroke:#25374a;stroke-width:2.5}.t{fill:#17283d;font:700 22px Arial,sans-serif;text-anchor:middle}.m{fill:#23364a;font:18px Arial,sans-serif}.n{fill:#475569;font:italic 18px Arial,sans-serif;text-anchor:middle}
</style><rect class="b" x="74" y="168" width="475" height="155" rx="2"/><text class="t" x="311.5" y="202">ClienteSingleton</text><path class="l" d="M74 220 H549"/><text class="m" x="88" y="250">+ ejecutar(out): void</text><text class="m" x="88" y="276">+ probar(): void</text><rect class="b" x="794" y="138" width="523" height="215" rx="2"/><text class="t" x="1055.5" y="172">PanelAvisos</text><path class="l" d="M794 190 H1317"/><text class="m" x="808" y="220">- UNICO: PanelAvisos {static, final}</text><text class="m" x="808" y="246">- avisos: List&lt;String&gt;</text><text class="m" x="808" y="272">+ instancia(): PanelAvisos {static}</text><text class="m" x="808" y="298">+ publicar(mensaje): void</text><path class="l d" d="M549 230 L794 230"/><path class="l" d="M778 218 L794 230 L778 242"/><text class="n" x="675" y="205">usa</text><text class="n" x="700" y="553">La identidad única es una decisión de esta demo, no una regla universal del dominio.</text></svg>