<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Observer: interruptor y receptores suscritos</title><desc id="descripcion">Interruptor mantiene referencias a 0..* ObservadorInterruptor. Luz y Alarma realizan el contrato. La relación no implica propiedad compuesta.</desc>
<style>
.caja{fill:#f2f6ff;stroke:#4373a5;stroke-width:2}
.interfaz{fill:#f3ecff;stroke:#8152b6;stroke-width:2}
.linea{stroke:#26374c;stroke-width:2.5;fill:none}
.dash{stroke-dasharray:9 6}
.nombre{font:700 20px Arial,sans-serif;fill:#152238;text-anchor:middle}
.metodo{font:17px Arial,sans-serif;fill:#23364a}
.nota{font:italic 16px Arial,sans-serif;fill:#415774;text-anchor:middle}
.triangulo{fill:white;stroke:#26374c;stroke-width:2.5}
</style><rect class="caja" x="25" y="58" width="280" height="119" rx="3"/><text class="nombre" x="165" y="89">ClienteObserver</text><line x1="25" y1="104" x2="305" y2="104" stroke="#8b9aaa"/><text class="metodo" x="38" y="132">+ ejecutar(out): void</text><rect class="caja" x="351" y="48" width="382" height="168" rx="3"/><text class="nombre" x="542" y="79">Interruptor</text><line x1="351" y1="94" x2="733" y2="94" stroke="#8b9aaa"/><text class="metodo" x="364" y="122">- observadores: Map&lt;String, ObservadorInterruptor&gt;</text><text class="metodo" x="364" y="146">+ suscribir(observador)</text><text class="metodo" x="364" y="170">+ pulsar(): void</text><rect class="interfaz" x="820" y="48" width="393" height="168" rx="3"/><text class="nombre" x="1016.5" y="79">«interface» ObservadorInterruptor</text><line x1="820" y1="94" x2="1213" y2="94" stroke="#8b9aaa"/><text class="metodo" x="833" y="122">+ id(): String</text><text class="metodo" x="833" y="146">+ alCambiar(activo): void</text><rect class="caja" x="685" y="350" width="240" height="113" rx="3"/><text class="nombre" x="805" y="381">Luz</text><line x1="685" y1="396" x2="925" y2="396" stroke="#8b9aaa"/><text class="metodo" x="698" y="424">+ alCambiar(activo)</text><rect class="caja" x="974" y="350" width="240" height="113" rx="3"/><text class="nombre" x="1094" y="381">Alarma</text><line x1="974" y1="396" x2="1214" y2="396" stroke="#8b9aaa"/><text class="metodo" x="987" y="424">+ alCambiar(activo)</text><path class="linea dash" d="M305 124 H351"/><path class="linea" d="M338 114 L351 124 L338 134"/>
<path class="linea" d="M733 124 H820"/><path class="linea" d="M807 114 L820 124 L807 134"/>
<text class="metodo" x="740" y="107">0..*</text>
<path class="linea dash" d="M805 350 L910 236"/>
<path class="linea dash" d="M1094 350 L1100 236"/>
<path class="triangulo" d="M896 236 L910 216 L924 236 Z"/>
<path class="triangulo" d="M1086 236 L1100 216 L1114 236 Z"/>
<text class="nota" x="620" y="516">Suscripción y notificación no significan propiedad de los observadores.</text></svg>