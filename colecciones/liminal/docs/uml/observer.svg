<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="640" viewBox="0 0 1480 640" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Observer — interruptor, luces y alarma</title>
<desc id="descripcion">ClienteObserver depende de Interruptor. Interruptor mantiene una asociación de cero o más observadores ObservadorInterruptor, sin propiedad compuesta. Luz y Alarma realizan la interfaz ObservadorInterruptor.</desc>
<defs><marker id="v" viewBox="0 0 24 24" markerWidth="11" markerHeight="11" refX="22" refY="12" orient="auto"><path d="M7 4 L22 12 L7 20" stroke="#26374c" stroke-width="2" fill="none"/></marker><marker id="tri" viewBox="0 0 24 24" markerWidth="13" markerHeight="13" refX="22" refY="12" orient="auto"><path d="M2 2 L22 12 L2 22 Z" fill="white" stroke="#26374c" stroke-width="2"/></marker></defs>
<style>.clase{fill:#f0f6ff;stroke:#4a77a2;stroke-width:2.2}.interfaz{fill:#f5edff;stroke:#8159a7;stroke-width:2.2}.linea{stroke:#26374c;stroke-width:2.5;fill:none}.dash{stroke-dasharray:9 7}.titulo{font:700 21px Arial,sans-serif;fill:#16283f;text-anchor:middle}.detalle{font:18px Arial,sans-serif;fill:#23364a}.etiqueta{font:17px Arial,sans-serif;fill:#2c475f}.nota{font:italic 17px Arial,sans-serif;fill:#475569;text-anchor:middle}.separador{stroke:#9bacc0;stroke-width:1.5}</style>
<rect width="1480" height="640" fill="#fff"/>
<!-- Conexiones detrás de las cajas -->
<path d="M320 163 H394" class="linea dash" marker-end="url(#v)"/>
<path d="M865 163 H960" class="linea" marker-end="url(#v)"/>
<text class="etiqueta" x="906" y="139">0..*</text>
<path d="M1020 394 V330 H1120 V245" class="linea dash" marker-end="url(#tri)"/>
<path d="M1310 394 V330 H1220 V245" class="linea dash" marker-end="url(#tri)"/>
<!-- Cliente -->
<rect class="clase" x="30" y="98" width="290" height="132" rx="3"/>
<text class="titulo" x="175" y="136">ClienteObserver</text>
<path class="separador" d="M30 153 H320"/>
<text class="detalle" x="48" y="187">+ ejecutar(out): void</text>
<!-- Sujeto -->
<rect class="clase" x="394" y="80" width="471" height="215" rx="3"/>
<text class="titulo" x="629.5" y="120">Interruptor</text>
<path class="separador" d="M394 140 H865"/>
<text class="detalle" x="412" y="176">- observadores: Map&lt;String,</text>
<text class="detalle" x="429" y="203">ObservadorInterruptor&gt;</text>
<text class="detalle" x="412" y="241">+ suscribir(observador): void</text>
<text class="detalle" x="412" y="268">+ pulsar(): void</text>
<!-- Contrato -->
<rect class="interfaz" x="960" y="80" width="465" height="165" rx="3"/>
<text class="titulo" x="1192.5" y="119">«interface» ObservadorInterruptor</text>
<path class="separador" d="M960 141 H1425"/>
<text class="detalle" x="980" y="176">+ id(): String</text>
<text class="detalle" x="980" y="206">+ alCambiar(activo): void</text>
<!-- Observadores concretos -->
<rect class="clase" x="865" y="394" width="305" height="138" rx="3"/>
<text class="titulo" x="1017.5" y="433">Luz</text>
<path class="separador" d="M865 451 H1170"/>
<text class="detalle" x="886" y="486">+ alCambiar(activo): void</text>
<rect class="clase" x="1205" y="394" width="230" height="138" rx="3"/>
<text class="titulo" x="1320" y="433">Alarma</text>
<path class="separador" d="M1205 451 H1435"/>
<text class="detalle" x="1219" y="486">+ alCambiar(activo)</text>
<text class="nota" x="740" y="602">Los observadores reciben avisos; estar suscrito no implica pertenecer al interruptor por composición.</text>
</svg>