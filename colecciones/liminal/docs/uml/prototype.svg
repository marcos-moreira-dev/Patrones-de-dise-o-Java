<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Prototype: una habitación se copia con identidad nueva</title><desc id="descripcion">HabitacionPrototipo implementa Prototipo y exige un nuevo ID al copiar una habitación configurada.</desc><style>
.b{fill:#f1f5ff;stroke:#3c6da1;stroke-width:2}.i{fill:#f4ecff;stroke:#8159a7;stroke-width:2}.l{stroke:#25374a;stroke-width:2.5;fill:none}.d{stroke-dasharray:9 7}.tri{fill:white;stroke:#25374a;stroke-width:2.5}.t{fill:#17283d;font:700 22px Arial,sans-serif;text-anchor:middle}.m{fill:#23364a;font:18px Arial,sans-serif}.n{fill:#475569;font:italic 18px Arial,sans-serif;text-anchor:middle}
</style><rect class="b" x="32" y="105" width="345" height="142" rx="2"/><text class="t" x="204.5" y="139">ClientePrototype</text><path class="l" d="M32 157 H377"/><text class="m" x="46" y="187">+ ejecutar(out): void</text><text class="m" x="46" y="213">+ main(args): void</text><rect class="i" x="492" y="50" width="412" height="155" rx="2"/><text class="t" x="698" y="84">«interface» Prototipo&lt;T&gt;</text><path class="l" d="M492 102 H904"/><text class="m" x="506" y="132">+ copiarConId(id): T</text><rect class="b" x="928" y="292" width="430" height="190" rx="2"/><text class="t" x="1143" y="326">HabitacionPrototipo</text><path class="l" d="M928 344 H1358"/><text class="m" x="942" y="374">+ id(): String</text><text class="m" x="942" y="400">+ objetos(): List&lt;String&gt;</text><text class="m" x="942" y="426">+ copiarConId(id)</text><path class="l d" d="M377 184 L928 385"/><path class="l d" d="M1120 292 L710 227"/><path class="tri" d="M695 225 L710 205 L725 225 Z"/><text class="n" x="700" y="553">La copia conserva la configuración, pero no el mismo ID ni la misma instancia.</text></svg>