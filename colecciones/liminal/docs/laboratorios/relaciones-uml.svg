<path d="M1030 701 H1380" class="sep"/>
<text x="1044" y="732" class="body">+ texto(): String</text><text x="1044" y="759" class="body">+ activa(): boolean</text><text class="caption" x="720" y="817" text-anchor="middle">◆ Composición: ciclo de vida exclusivo · ◇ Agregación: miembros independientes · Línea: asociación · Punteada: dependencia o realización</text></svg>