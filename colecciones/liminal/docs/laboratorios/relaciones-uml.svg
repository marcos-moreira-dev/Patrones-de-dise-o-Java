<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Relaciones UML: reglas del dominio, no patrones GoF</title><desc id="descripcion">Composición: RegistroExpedicion, rombo negro, posee EntradaRegistro. Agregación compartida: EquipoExploracion, rombo blanco, agrupa Explorador. Asociación: Explorador apunta a Habitacion. Dependencia: ServicioConsulta usa Explorador. InformeExpedicion observa VistaEntrada sin poseerla.</desc><defs>
<marker id="nav" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#283E56" stroke-width="1.5" fill="none"/></marker>
