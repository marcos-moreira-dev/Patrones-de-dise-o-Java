<text x="235" y="124" class="name">MapaLiminal</text>
<path d="M60 141 H410" class="sep"/>
<text x="74" y="172" class="body">- habitaciones: Map&lt;String, Habitacion&gt;</text><text x="74" y="199" class="body">+ buscar(id): Habitacion</text><rect x="520" y="90" width="390" height="160" rx="4" fill="#EBF3FF" stroke="#376B9A" stroke-width="2.4"/>
