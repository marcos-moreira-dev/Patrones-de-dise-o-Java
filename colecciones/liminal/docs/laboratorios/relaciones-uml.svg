<path d="M520 141 H910" class="sep"/>
<text x="534" y="172" class="body">- integrantes: Set&lt;Explorador&gt;</text><text x="534" y="199" class="body">+ agregar(explorador)</text><text x="534" y="226" class="body">+ disolver(): void</text><rect x="1030" y="90" width="350" height="194" rx="4" fill="#EBF3FF" stroke="#376B9A" stroke-width="2.4"/>
