<text class="caption" x="732" y="304">agrupa 0..*</text>
<path class="edge" d="M1205 310 V365"/>
<polygon points="1205,284 1218,297 1205,310 1192,297" fill="#283E56" stroke="#283E56" stroke-width="2"/>
