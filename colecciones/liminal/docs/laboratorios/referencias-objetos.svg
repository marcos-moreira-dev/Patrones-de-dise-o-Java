<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Diagrama de objetos: antes y después</title><desc id="descripcion">Antes dos equipos comparten el mismo Explorador y un Registro posee una Entrada que un Informe observa. Después el equipo Luces se disuelve y el registro se cierra: el explorador sobrevive y la entrada sigue siendo un objeto alcanzable por referencia pero ya no está activa en el dominio.</desc><defs>
