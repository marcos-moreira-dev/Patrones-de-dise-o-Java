<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc"><title id="title">State: transiciones válidas de una puerta</title><desc id="desc">Puerta inicialmente cerrada. Abrir lleva a abierta, cerrar a cerrada, bloquear desde cerrada a bloqueada y desbloquear con llave autorizada vuelve a cerrada. Atravesar solo es válido cuando está abierta y no cambia estado.</desc><defs><marker id="arrow" viewBox="0 0 24 24" markerWidth="12" markerHeight="12" refX="22" refY="12" orient="auto"><path d="M5 3 L22 12 L5 21" stroke="#314765" fill="none" stroke-width="2.4"/></marker></defs><style>
.bg{fill:#ffffff}.panel{fill:#f0f5ff;stroke:#4775a3;stroke-width:2.5}.purple{fill:#f7f0ff;stroke:#8064ac;stroke-width:2.5}.amber{fill:#fff7e6;stroke:#b38a46;stroke-width:2.5}
.head{font:700 29px Arial,sans-serif;fill:#162a42;text-anchor:middle}.sub{font:18px Arial,sans-serif;fill:#516780;text-anchor:middle}.label{font:700 25px Arial,sans-serif;fill:#182d44;text-anchor:middle}.body{font:20px Arial,sans-serif;fill:#253d58;text-anchor:middle}.caption{font:18px Arial,sans-serif;fill:#4c6177;text-anchor:middle}.small{font:17px Arial,sans-serif;fill:#4c6177;text-anchor:middle}.arrow{stroke:#314765;fill:none;stroke-width:3}.guide{stroke:#bdcddd;stroke-width:2;fill:none}</style><rect class="bg" width="1600" height="680"/><text x="800" y="60" class="head">R-05 · Transiciones de una puerta</text><text x="800" y="96" class="sub">Las flechas son acciones permitidas; las demás operaciones se rechazan sin cambiar el estado.</text><path class="arrow" d="M800 137 V218" marker-end="url(#arrow)"/><circle cx="800" cy="136" r="11" fill="#314765"/><text x="865" y="189" class="small">Estado inicial</text><path class="arrow" d="M620 292 H404" marker-end="url(#arrow)"/><text x="510" y="278" class="small">abrir</text><path class="arrow" d="M404 378 H620" marker-end="url(#arrow)"/><text x="510" y="365" class="small">cerrar</text><path class="arrow" d="M980 292 H1196" marker-end="url(#arrow)"/><text x="1090" y="278" class="small">bloquear</text><path class="arrow" d="M1196 378 H980" marker-end="url(#arrow)"/><text x="1090" y="365" class="small">desbloquear*</text><rect class="panel" x="54" y="218" width="350" height="190" rx="10"/><text x="229" y="261" class="label">ABIERTA</text><text x="229" y="309" class="body">transitable = true</text><text x="229" y="340" class="body">atravesar: permitido</text><text x="229" y="371" class="body">sin cambio de estado</text><rect class="purple" x="620" y="218" width="360" height="190" rx="10"/><text x="800" y="261" class="label">CERRADA</text><text x="800" y="309" class="body">transitable = false</text><text x="800" y="340" class="body">abrir → ABIERTA</text><text x="800" y="371" class="body">bloquear → BLOQUEADA</text><rect class="amber" x="1196" y="218" width="350" height="190" rx="10"/><text x="1371" y="261" class="label">BLOQUEADA</text><text x="1371" y="309" class="body">transitable = false</text><text x="1371" y="340" class="body">abrir: rechazo</text><text x="1371" y="371" class="body">llave errónea: rechazo</text><text x="800" y="478" class="body">* Desbloquear requiere una llave autorizada. El resultado es CERRADA, no ABIERTA.</text><rect x="190" y="521" width="1220" height="94" rx="8" fill="#f4f7fb" stroke="#c9d6e6"/><text x="800" y="554" class="body">Un rechazo conserva el estado anterior: ninguna transición parcial.</text><text x="800" y="584" class="caption">El diagrama describe R-05. No sustituye al UML de clases de State.</text></svg>