<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="268" viewBox="0 0 1060 268" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Herencia entre Animal y Perro</title><desc id="descripcion">Perro hereda de Animal y el triangulo hueco apunta a Animal.</desc>
<style>
  .caja{fill:#f0f5ff;stroke:#3972bf;stroke-width:2}
  .division{stroke:#3972bf;stroke-width:1.4}
  .nombre{fill:#152238;font:bold 23px Arial,sans-serif;text-anchor:middle}
  .stereotipo{fill:#40526b;font:italic 17px Arial,sans-serif;text-anchor:middle}
  .texto{fill:#202936;font:19px Arial,sans-serif}
  .linea{stroke:#202936;stroke-width:2.8;fill:none}
  .discontinua{stroke-dasharray:9 7}
  .triangulo{stroke:#202936;stroke-width:2.8;fill:white}
</style>
<rect class="caja" x="24" y="93" width="350" height="96" rx="2"/>
<text class="nombre" x="199" y="150">Animal</text>
<rect class="caja" x="686" y="93" width="350" height="96" rx="2"/>
<text class="nombre" x="861" y="150">Perro</text>
<line class="linea " x1="408" y1="141" x2="686" y2="141"/>
<path class="triangulo" d="M374 141 L408 123 L408 159 Z"/>
</svg>
