<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Flyweight — Texturas de pared compartidas</title><desc id="descripcion">Paredes distintas conservan referencias a la misma textura inmutable, que la fábrica reutiliza.</desc>
<defs><marker id="triangle" viewBox="0 0 24 24" markerWidth="13" markerHeight="13" refX="22" refY="12" orient="auto"><path d="M2 2 L22 12 L2 22 Z" fill="white" stroke="#25374a" stroke-width="2"/></marker>
<marker id="open" viewBox="0 0 24 24" markerWidth="10" markerHeight="10" refX="22" refY="12" orient="auto"><path d="M7 3 L22 12 L7 21" fill="none" stroke="#25374a" stroke-width="2"/></marker></defs>
<style>.box{fill:#f1f5ff;stroke:#4272a5;stroke-width:2.4}.iface{fill:#f4ecff;stroke:#825cac;stroke-width:2.4}.sep{stroke:#8194ad;stroke-width:1.4}.title{fill:#18283d;font:700 21px Arial,sans-serif;text-anchor:middle}.body{fill:#23364a;font:17px Arial,sans-serif}.edge{fill:none;stroke:#25374a;stroke-width:2.4}.dashed{stroke-dasharray:8 6}.note{fill:#475569;font:italic 17px Arial,sans-serif;text-anchor:middle}</style>
<path class="edge dashed" d="M348 152 L466 152" marker-end="url(#open)"/>
<path class="edge" d="M891 152 L1010 342" marker-end="url(#open)"/>
<text x="913" y="239" class="body">0..*</text>
<path class="edge" d="M865 435.5 L1010 342" marker-end="url(#open)"/>
<rect x="38" y="92" width="310" height="120" rx="3" class="box"/><text x="193" y="127" class="title">ClienteFlyweight</text><path d="M38 145 H348" class="sep"/><text x="52" y="176" class="body">+ ejecutar(out): void</text>
<rect x="466" y="72" width="425" height="160" rx="3" class="box"/><text x="678.5" y="107" class="title">FabricaTexturas</text><path d="M466 125 H891" class="sep"/><text x="480" y="156" class="body">- texturas: Map&lt;ClaveTextura, Textura&gt;</text><text x="480" y="182" class="body">~ obtener(...): Textura</text>
<rect x="440" y="366" width="425" height="139" rx="3" class="box"/><text x="652.5" y="401" class="title">Pared</text><path d="M440 419 H865" class="sep"/><text x="454" y="450" class="body">- id: String</text><text x="454" y="476" class="body">- textura: Textura</text>
<rect x="1010" y="262" width="350" height="160" rx="3" class="box"/><text x="1185" y="297" class="title">Textura</text><path d="M1010 315 H1360" class="sep"/><text x="1024" y="346" class="body">- material: String</text><text x="1024" y="372" class="body">- color: String</text>
<text class="note" x="700" y="626">Dos entidades no se vuelven una sola por compartir el objeto textura.</text></svg>