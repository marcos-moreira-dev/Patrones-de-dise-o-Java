<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Memento — Restaurar la linterna</title><desc id="descripcion">Linterna captura y restaura Linterna.Recuerdo; Historial guarda las instantáneas sin inspeccionar sus campos.</desc><defs>
<marker id="tri" viewBox="0 0 24 24" markerWidth="13" markerHeight="13" refX="22" refY="12" orient="auto"><path d="M2 2 L22 12 L2 22 Z" fill="white" stroke="#25374a" stroke-width="2"/></marker>
<marker id="open" viewBox="0 0 24 24" markerWidth="10" markerHeight="10" refX="22" refY="12" orient="auto"><path d="M7 3 L22 12 L7 21" fill="none" stroke="#25374a" stroke-width="2"/></marker>
</defs><style>.box{fill:#f1f5ff;stroke:#4272a5;stroke-width:2.4}.iface{fill:#f4ecff;stroke:#825cac;stroke-width:2.4}.sep{stroke:#8194ad;stroke-width:1.4}.title{fill:#18283d;font:700 20px Arial,sans-serif;text-anchor:middle}.body{fill:#23364a;font:17px Arial,sans-serif}.edge{fill:none;stroke:#25374a;stroke-width:2.4}.dash{stroke-dasharray:8 6}.note{fill:#475569;font:italic 17px Arial,sans-serif;text-anchor:middle}</style>
<path class="edge dash" d="M367 170.5 L477 160" marker-end="url(#open)"/>
<path class="edge dash" d="M367 170.5 L1020 158" marker-end="url(#open)"/>
<path class="edge dash" d="M699.5 250 L910 370" marker-end="url(#open)"/>
<path class="edge" d="M1188 228 L910 370" marker-end="url(#open)"/>
<path class="edge" d="M1020 111 L922 111" marker-end="url(#open)"/>
<rect x="34" y="103" width="333" height="135" rx="3" class="box"/><text class="title" x="200.5" y="137">ClienteMemento</text><path class="sep" d="M34 155 H367"/><text class="body" x="48" y="186">+ ejecutar(out)</text>
<rect x="477" y="70" width="445" height="180" rx="3" class="box"/><text class="title" x="699.5" y="104">Linterna</text><path class="sep" d="M477 122 H922"/><text class="body" x="491" y="153">~ configurar(...)</text><text class="body" x="491" y="178">~ guardarEstado(): Recuerdo</text><text class="body" x="491" y="203">~ restaurar(recuerdo)</text>
<rect x="1020" y="88" width="336" height="140" rx="3" class="box"/><text class="title" x="1188" y="122">Historial</text><path class="sep" d="M1020 140 H1356"/><text class="body" x="1034" y="166">- origen: Linterna</text><text class="body" x="1034" y="187">~ guardar(linterna)</text><text class="body" x="1034" y="208">~ deshacer(linterna)</text>
<rect x="665" y="370" width="490" height="145" rx="3" class="box"/><text class="title" x="910" y="404">Linterna.Recuerdo</text><path class="sep" d="M665 422 H1155"/><text class="body" x="679" y="453">- intensidad: int {private}</text><text class="body" x="679" y="478">- filtroAzul: boolean {private}</text>
<text class="note" x="700" y="627">El historial conserva una instantánea opaca; no modifica la configuración de Linterna.</text></svg>