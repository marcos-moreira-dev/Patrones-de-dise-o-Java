<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="680" viewBox="0 0 1540 680" role="img" aria-labelledby="title desc"><title id="title">Observer: interruptor y observadores</title><desc id="desc">Un interruptor I-01 notifica a Luz L-01 y Alarma A-01. Estado inicial desactivado. Primera pulsación notifica true, enciende la luz e incrementa alarma a un aviso. Segunda pulsación notifica false, apaga la luz y no incrementa alarma.</desc><defs><marker id="arrow" viewBox="0 0 24 24" markerWidth="12" markerHeight="12" refX="22" refY="12" orient="auto"><path d="M5 3 L22 12 L5 21" stroke="#314765" fill="none" stroke-width="2.4"/></marker></defs><style>
.bg{fill:#ffffff}.panel{fill:#f0f5ff;stroke:#4775a3;stroke-width:2.5}.purple{fill:#f7f0ff;stroke:#8064ac;stroke-width:2.5}.amber{fill:#fff7e6;stroke:#b38a46;stroke-width:2.5}
.head{font:700 29px Arial,sans-serif;fill:#162a42;text-anchor:middle}.sub{font:18px Arial,sans-serif;fill:#516780;text-anchor:middle}.label{font:700 25px Arial,sans-serif;fill:#182d44;text-anchor:middle}.body{font:20px Arial,sans-serif;fill:#253d58;text-anchor:middle}.caption{font:18px Arial,sans-serif;fill:#4c6177;text-anchor:middle}.small{font:17px Arial,sans-serif;fill:#4c6177;text-anchor:middle}.arrow{stroke:#314765;fill:none;stroke-width:3}.guide{stroke:#bdcddd;stroke-width:2;fill:none}</style><rect class="bg" width="1540" height="680"/><text x="770" y="60" class="head">R-07 · Un interruptor notifica a dos observadores</text><text x="770" y="97" class="sub">Suscribirse guarda referencias; no implica propiedad exclusiva de Luz ni Alarma.</text><rect class="purple" x="80" y="205" width="360" height="152" rx="10"/><text x="260" y="248" class="label">Interruptor I-01</text><text x="260" y="296" class="body">pulsar()</text><text x="260" y="327" class="body">notificar cambio</text><rect class="panel" x="590" y="205" width="360" height="152" rx="10"/><text x="770" y="248" class="label">Luz L-01</text><text x="770" y="296" class="body">alCambiar(activo)</text><text x="770" y="327" class="body">actualiza encendida</text><rect class="amber" x="1100" y="205" width="360" height="152" rx="10"/><text x="1280" y="248" class="label">Alarma A-01</text><text x="1280" y="296" class="body">alCambiar(activo)</text><text x="1280" y="327" class="body">incrementa si activo</text><path class="arrow" d="M440 286 H590" marker-end="url(#arrow)"/><path class="arrow" d="M257 205 V151 H1280 V205" marker-end="url(#arrow)"/><text x="510" y="275" class="small">aviso</text><text x="846" y="139" class="small">aviso al segundo observador</text><rect x="52" y="425" width="430" height="158" rx="10" fill="#f7f9fc" stroke="#ccdae9"/><rect x="554" y="425" width="430" height="158" rx="10" fill="#eef7ff" stroke="#a7c5e3"/><rect x="1056" y="425" width="430" height="158" rx="10" fill="#f7f9fc" stroke="#ccdae9"/><text x="267" y="465" class="label">ANTES</text><text x="267" y="496" class="body">Interruptor: desactivado</text><text x="267" y="527" class="body">Luz: apagada</text><text x="267" y="558" class="body">Avisos de alarma: 0</text><text x="769" y="465" class="label">PRIMERA PULSACIÓN</text><text x="769" y="496" class="body">Interruptor: activado</text><text x="769" y="527" class="body">Luz: encendida</text><text x="769" y="558" class="body">Avisos de alarma: 1</text><text x="1271" y="465" class="label">SEGUNDA PULSACIÓN</text><text x="1271" y="496" class="body">Interruptor: desactivado</text><text x="1271" y="527" class="body">Luz: apagada</text><text x="1271" y="558" class="body">Avisos de alarma: 1</text><text x="770" y="649" class="caption">Demostración síncrona: las notificaciones se envían durante pulsar(), sin transacciones ni concurrencia.</text></svg>