<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="710" viewBox="0 0 1680 710" role="img" aria-labelledby="title desc"><title id="title">Strategy: un monstruo, tres comportamientos</title><desc id="desc">El mismo monstruo M-01 parte del pasillo amarillo, patrulla a la piscina, cambia a perseguir y regresa por una salida dirigida; finalmente adopta esperar y se mantiene en el pasillo.</desc><defs><marker id="arrow" viewBox="0 0 24 24" markerWidth="12" markerHeight="12" refX="22" refY="12" orient="auto"><path d="M5 3 L22 12 L5 21" stroke="#314765" fill="none" stroke-width="2.4"/></marker></defs><style>
.bg{fill:#ffffff}.panel{fill:#f0f5ff;stroke:#4775a3;stroke-width:2.5}.purple{fill:#f7f0ff;stroke:#8064ac;stroke-width:2.5}.amber{fill:#fff7e6;stroke:#b38a46;stroke-width:2.5}
.head{font:700 29px Arial,sans-serif;fill:#162a42;text-anchor:middle}.sub{font:18px Arial,sans-serif;fill:#516780;text-anchor:middle}.label{font:700 25px Arial,sans-serif;fill:#182d44;text-anchor:middle}.body{font:20px Arial,sans-serif;fill:#253d58;text-anchor:middle}.caption{font:18px Arial,sans-serif;fill:#4c6177;text-anchor:middle}.small{font:17px Arial,sans-serif;fill:#4c6177;text-anchor:middle}.arrow{stroke:#314765;fill:none;stroke-width:3}.guide{stroke:#bdcddd;stroke-width:2;fill:none}</style><rect class="bg" width="1680" height="710"/><text x="840" y="60" class="head">R-08 · Misma criatura, estrategia intercambiable</text><text x="840" y="96" class="sub">La ubicación cambia cuando una estrategia propone un destino válido del mapa; la identidad M-01 no cambia.</text><rect class="panel" x="35" y="195" width="370" height="205" rx="10"/><text x="220" y="238" class="label">0 · INICIO</text><text x="220" y="286" class="body">Pasillo amarillo</text><text x="220" y="317" class="body">estrategia: Patrullar</text><text x="220" y="348" class="body">M-01 creado</text><path class="arrow" d="M405 298 H442" marker-end="url(#arrow)"/><rect class="purple" x="443" y="195" width="370" height="205" rx="10"/><text x="628" y="238" class="label">1 · PATRULLAR</text><text x="628" y="286" class="body">Piscina vacía</text><text x="628" y="317" class="body">primera salida: S-01</text><text x="628" y="348" class="body">avanzar(Pasillo amarillo)</text><path class="arrow" d="M813 298 H850" marker-end="url(#arrow)"/><rect class="panel" x="851" y="195" width="370" height="205" rx="10"/><text x="1036" y="238" class="label">2 · PERSEGUIR</text><text x="1036" y="286" class="body">Pasillo amarillo</text><text x="1036" y="317" class="body">objetivo adyacente</text><text x="1036" y="348" class="body">cambiar a Perseguir + avanzar</text><path class="arrow" d="M1221 298 H1258" marker-end="url(#arrow)"/><rect class="purple" x="1259" y="195" width="370" height="205" rx="10"/><text x="1444" y="238" class="label">3 · ESPERAR</text><text x="1444" y="286" class="body">Pasillo amarillo</text><text x="1444" y="317" class="body">conserva ubicación</text><text x="1444" y="348" class="body">cambiar a Esperar + avanzar</text><rect x="185" y="466" width="1310" height="153" rx="10" fill="#f5f8fc" stroke="#c9d6e6"/><text x="840" y="499" class="body">El mapa de este ejemplo contiene salidas dirigidas en ambos sentidos:</text><text x="840" y="537" class="body">Pasillo amarillo ── S-01 ──▶ Piscina vacía</text><text x="840" y="570" class="body">Piscina vacía ── S-02 ──▶ Pasillo amarillo</text><text x="840" y="669" class="caption">Una estrategia propone el movimiento; MonstruoOscuro verifica las conexiones (R-02 y R-12).</text></svg>