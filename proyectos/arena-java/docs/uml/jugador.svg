<svg xmlns="http://www.w3.org/2000/svg" width="790" height="400" viewBox="0 0 790 400" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Jugador: entidad del dominio</title>
  <desc id="descripcion">Clase Jugador con atributos privados para nombre, vida y energía; operaciones públicas que mantienen las invariantes. La clase no es un simple formulario de datos.</desc>
  <style>
    .c{fill:#f0f5ff;stroke:#3972bf;stroke-width:2}
    .d{stroke:#3972bf;stroke-width:1.5}
    .n{fill:#152238;font:bold 23px Arial,sans-serif;text-anchor:middle}
    .t{fill:#202936;font:19px Arial,sans-serif}
  </style>
  <rect class="c" x="176" y="18" width="438" height="368" rx="3"/>
  <text class="n" x="395" y="56">Jugador</text>
  <line class="d" x1="176" y1="77" x2="614" y2="77"/>
  <text class="t" x="193" y="111">- nombre: String</text>
  <text class="t" x="193" y="140">- vida: int</text>
  <text class="t" x="193" y="169">- energia: int</text>
  <text class="t" x="193" y="198">- vidaMaxima: int</text>
  <text class="t" x="193" y="227">- energiaMaxima: int</text>
  <line class="d" x1="176" y1="246" x2="614" y2="246"/>
  <text class="t" x="193" y="278">+ recibirDanio(puntos: int): void</text>
  <text class="t" x="193" y="305">+ consumirEnergia(puntos: int): boolean</text>
  <text class="t" x="193" y="332">+ recuperarEnergia(puntos: int): void</text>
  <text class="t" x="193" y="359">+ estaVivo(): boolean</text>
</svg>
