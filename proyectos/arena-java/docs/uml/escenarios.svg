<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="392" viewBox="0 0 1020 392" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Strategy: reglas para arena y bosque</title>
  <desc id="descripcion">ReglasArena y ReglasBosque implementan ReglasEscenario. Dos líneas discontinuas con triángulos huecos apuntan a la interfaz.</desc>
  <style>
    .caja{fill:#f0f5ff;stroke:#3972bf;stroke-width:2}
    .division{stroke:#3972bf;stroke-width:1.4}
    .nombre{fill:#152238;font:bold 23px Arial,sans-serif;text-anchor:middle}
    .estereotipo{fill:#40526b;font:italic 17px Arial,sans-serif;text-anchor:middle}
    .texto{fill:#202936;font:17px Arial,sans-serif}
    .linea{fill:none;stroke:#202936;stroke-width:2.8;stroke-dasharray:9 7}
    .triangulo{stroke:#202936;stroke-width:2.8;fill:white}
  </style>
  <rect class="caja" x="340" y="16" width="340" height="145" rx="3"/>
  <text class="nombre" x="510" y="45">ReglasEscenario</text>
  <text class="estereotipo" x="510" y="70">«interface»</text>
  <line class="division" x1="340" y1="85" x2="680" y2="85"/>
  <text class="texto" x="354" y="110">+ nombre(): String</text>
  <text class="texto" x="354" y="132">+ impedimento(a): Optional&lt;String&gt;</text>
  <text class="texto" x="354" y="153">+ danioTerreno(t, a): int</text>
  <rect class="caja" x="40" y="231" width="390" height="120" rx="3"/>
  <text class="nombre" x="235" y="267">ReglasArena</text>
  <line class="division" x1="40" y1="286" x2="430" y2="286"/>
  <text class="texto" x="58" y="318">+ impedimento(a): Optional&lt;String&gt;</text>
  <rect class="caja" x="590" y="231" width="390" height="120" rx="3"/>
  <text class="nombre" x="785" y="267">ReglasBosque</text>
  <line class="division" x1="590" y1="286" x2="980" y2="286"/>
  <text class="texto" x="608" y="318">+ danioTerreno(t, a): int</text>
  <line class="linea" x1="235" y1="231" x2="445" y2="194"/>
  <path class="triangulo" d="M445 161 L430 191 L460 191 Z"/>
  <line class="linea" x1="785" y1="231" x2="575" y2="194"/>
  <path class="triangulo" d="M575 161 L560 191 L590 191 Z"/>
</svg>
