name: Java 21 y Javadoc

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # El script ya compila los 23 patrones clásicos y liminales,
      # ejecuta las pruebas Maven de Arena/MiniSO y comprueba ambos JAR.
      - name: Verificar colecciones, microproyectos y JAR ejecutables
        run: bash scripts/verificar.sh
      - name: Generar documentacion Javadoc
        run: |
          mkdir -p out/javadoc
          find . -name '*.java' -not -path './.git/*' -print0 | xargs -0 javadoc -quiet -encoding UTF-8 -charset UTF-8 -d out/javadoc

  verificar-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar laboratorio en Git Bash de Windows
        run: bash scripts/verificar.sh
