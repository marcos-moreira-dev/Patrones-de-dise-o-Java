name: Java 21 y Javadoc

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar ejemplos
        run: |
          mkdir -p out
          find . -name '*.java' -not -path './.git/*' -print0 | xargs -0 javac -encoding UTF-8 -d out
      - name: Probar Arena Java
        run: java -cp out arena.PruebasArena
      - name: Probar MiniSO
        run: java -cp out miniso.PruebasMiniSO
      - name: Verificar ambos proyectos y JAR ejecutables
        run: bash scripts/verificar.sh
      - name: Generar documentacion Javadoc
        run: |
          mkdir -p out/javadoc
          find . -name '*.java' -not -path './.git/*' -print0 | xargs -0 javadoc -quiet -encoding UTF-8 -charset UTF-8 -d out/javadoc
